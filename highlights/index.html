  <script>
    (function () {
      var filenames = Array.isArray(window.AS_HIGHLIGHT_STORIES) ? window.AS_HIGHLIGHT_STORIES : [];
      var grid = document.querySelector('.highlights-grid');
      grid.innerHTML = filenames.map(function (filename, index) {
        var number = index + 1;
        var loading = index < 4 ? 'eager' : 'lazy';
        return '<button class="highlight-story fade-up" type="button" data-story="' + index + '" aria-label="開啟精選紀錄第 ' + number + ' 張"><img src="../assets/highlights/' + filename + '" alt="AS 精選紀錄第 ' + number + ' 張" width="1080" height="1920" loading="' + loading + '" decoding="async"></button>';
      }).join('');
      var stories = Array.from(grid.querySelectorAll('.highlight-story img')).map(function (storyImage) { return { src: storyImage.currentSrc || storyImage.src, alt: storyImage.alt }; });
      var dialog = document.querySelector('.story-dialog'); var image = dialog.querySelector('img'); var counter = dialog.querySelector('.story-counter'); var current = 0;
      function show(index) { current = (index + stories.length) % stories.length; image.src = stories[current].src; image.alt = stories[current].alt; counter.textContent = (current + 1) + ' / ' + stories.length; }
      document.querySelectorAll('.highlight-story').forEach(function (button) { button.addEventListener('click', function () { show(Number(button.dataset.story)); dialog.showModal(); }); });
      dialog.querySelector('.story-close').addEventListener('click', function () { dialog.close(); });
      dialog.querySelector('.story-prev').addEventListener('click', function () { show(current - 1); });
      dialog.querySelector('.story-next').addEventListener('click', function () { show(current + 1); });
      dialog.addEventListener('click', function (event) { if (event.target === dialog) dialog.close(); });
      document.addEventListener('keydown', function (event) { if (!dialog.open) return; if (event.key === 'ArrowLeft') show(current - 1); if (event.key === 'ArrowRight') show(current + 1); });
    }());
  </script>
